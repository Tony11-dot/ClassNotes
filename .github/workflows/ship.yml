name: Ship

# Cloud release to TestFlight — exists because a build ARCHIVED on this Mac
# gets rejected by App Store Connect with ITMS-90111 ("Unsupported SDK or
# Xcode version") the moment the Mac itself is on a beta macOS: Apple stamps
# every binary with BuildMachineOSBuild and refuses one from an unreleased
# host OS, no matter how current Xcode is. Same wall ClassMate hit — same
# fix: archive on a GitHub-hosted runner pinned to a released macOS/Xcode
# instead of the dev machine. See ClassMate's apps/classmate_mobile/
# .github/workflows/ship.yml `ios` job, which this mirrors.
#
# Trigger:  Actions → Ship → Run workflow   (or:  gh workflow run ship.yml)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: TestFlight "What to Test" notes (optional)
        type: string
        default: ""

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

# The job commits the build-number bump back to main after a successful
# upload, so the workflow token needs write access to repo contents.
permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26.x
        # The image's default Xcode is not always its newest 26.x. Pin
        # explicitly so the archive gets a GA Xcode/SDK — the whole point
        # of building here instead of the beta-OS dev Mac.
        working-directory: /
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -z "$latest" ]; then
            echo "::error::No Xcode 26.x on this runner image."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          sw_vers

      - name: Write App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$P8_B64" | base64 -d > "$RUNNER_TEMP/asc/AuthKey_Z5KM7D8NG8.p8"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: fastlane beta
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey_Z5KM7D8NG8.p8
        run: fastlane beta notes:"${{ inputs.notes }}"

      - name: Commit version bump
        if: success()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ClassNotes.xcodeproj/project.pbxproj
          if ! git diff --cached --quiet; then
            build=$(git diff --cached ClassNotes.xcodeproj/project.pbxproj | grep -m1 '^+.*CURRENT_PROJECT_VERSION' | grep -o '[0-9]\+' | head -1)
            git commit -m "Record Build ${build:-N}'s version bump"
            git push
          fi
